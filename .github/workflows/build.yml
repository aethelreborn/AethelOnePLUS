name: Build with Gradle

on:
  push:
    branches: '*'
    paths-ignore:
      - 'README.md'
      - 'LICENSE.md'
      - '.gitignore'
  pull_request:
    branches: '*'
    paths-ignore:
      - 'README.md'
      - 'LICENSE.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build ${{ matrix.version }}"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        version: ["1.8.9", "1.21.1", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1", "26.2", "26.3"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - run: chmod +x ./gradlew
      - name: Build Stonecutter version
        run: |
          ./gradlew ":${{ matrix.version }}-${{ matrix.version == '1.8.9' && 'ornithe' || 'fabric' }}:build"

      - name: Resolve built mod jar
        id: mod-jar
        run: |
          mapfile -t jars < <(find "versions/${{ matrix.version }}-${{ matrix.version == '1.8.9' && 'ornithe' || 'fabric' }}/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)

          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one non-sources jar, found %s:\n' "${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload built mod jar
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.version }}
          path: ${{ steps.mod-jar.outputs.path }}
          archive: false
          if-no-files-found: error

  release:
    name: Publish rolling release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: jar-*
          merge-multiple: true
          path: jars

      - name: Generate mirror manifest
        run: python3 .github/scripts/polyplus_mirror_manifest.py

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view continuous --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete continuous --repo "$GITHUB_REPOSITORY" --cleanup-assets --yes
          fi

          # Recreate with jars first; the manifest is uploaded last so the
          # release never contains a manifest pointing at jars that are gone.
          # Any window where polyplus-mirror.json is missing is safe: the
          # launcher treats that as a miss and falls back to the official
          # Modrinth download.
          created=""
          for i in 1 2 3 4 5; do
            if gh release create continuous dist/*.jar \
              --repo "$GITHUB_REPOSITORY" \
              --latest \
              --title "Rolling PolyPlus mirror" \
              --notes "Automated build of PolyPlus (patched) with polyplus-mirror.json for the AethelONE launcher. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; then
              created=yes
              break
            fi
            sleep 5
          done
          if [ -z "$created" ]; then
            echo "::error::failed to create the continuous release"
            exit 1
          fi

          gh release upload continuous polyplus-mirror.json --repo "$GITHUB_REPOSITORY"
          gh release view continuous --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
